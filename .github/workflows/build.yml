name: build
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/JellyDrax -c Release -o dist
      - name: Installer bauen (NSIS ist auf windows-latest vorinstalliert)
        run: makensis -DVERSION=2.0.0 installer/JellyDrax.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: JellyDrax-win-x64
          path: |
            dist/JellyDrax.exe
            dist/JellyDrax-Setup-*.exe
