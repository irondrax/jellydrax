name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # zum Anlegen von Releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Version bestimmen
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/JellyDrax/JellyDrax.csproj)" >> "$GITHUB_ENV"
          fi

      - name: EXE bauen
        shell: bash
        run: dotnet publish src/JellyDrax -c Release -o dist -p:Version="$VERSION"

      - name: NSIS installieren
        run: choco install nsis -y --no-progress

      - name: Installer bauen
        shell: cmd
        run: '"%ProgramFiles(x86)%\NSIS\makensis.exe" -DVERSION=%VERSION% installer\JellyDrax.nsi'

      - uses: actions/upload-artifact@v5
        with:
          name: JellyDrax-windows
          path: |
            dist/JellyDrax.exe
            dist/JellyDrax-Setup-*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/package-lock.json

      - name: Version bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/JellyDrax/JellyDrax.csproj)" >> "$GITHUB_ENV"
          fi

      - name: Werkzeuge für rpm- und pacman-Pakete
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm libarchive-tools

      - name: Pakete bauen (AppImage, deb, rpm, pacman)
        working-directory: linux
        run: |
          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run dist

      - uses: actions/upload-artifact@v5
        with:
          name: JellyDrax-linux
          path: |
            linux/dist/*.AppImage
            linux/dist/*.deb
            linux/dist/*.rpm
            linux/dist/*.pacman

  # Release automatisch: bei einem Versions-Tag oder wenn auf main eine neue Versionsnummer
  # (<Version> in JellyDrax.csproj) ankommt, für die es noch kein Release gibt.
  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/JellyDrax/JellyDrax.csproj)" >> "$GITHUB_ENV"
          fi

      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag existiert bereits – nichts zu tun."
            exit 0
          fi
          notes=".github/release-notes/$tag.md"
          if [[ -f "$notes" ]]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          ls -la release
          gh release create "$tag" release/* \
            --target "$GITHUB_SHA" \
            --title "JellyDrax $VERSION" "${args[@]}"
