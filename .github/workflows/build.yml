name: build
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/JellyDrax -c Release -o dist
      - name: NSIS installieren
        run: choco install nsis -y --no-progress
      - name: Installer bauen
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -DVERSION=2.1.0 installer/JellyDrax.nsi'
      - uses: actions/upload-artifact@v5
        with:
          name: JellyDrax-win-x64
          path: |
            dist/JellyDrax.exe
            dist/JellyDrax-Setup-*.exe
