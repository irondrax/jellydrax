name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # zum Anlegen von Releases bei Versions-Tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Version bestimmen
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/JellyDrax/JellyDrax.csproj)" >> "$GITHUB_ENV"
          fi

      - name: EXE bauen
        shell: bash
        run: dotnet publish src/JellyDrax -c Release -o dist -p:Version="$VERSION"

      - name: NSIS installieren
        run: choco install nsis -y --no-progress

      - name: Installer bauen
        shell: cmd
        run: '"%ProgramFiles(x86)%\NSIS\makensis.exe" -DVERSION=%VERSION% installer\JellyDrax.nsi'

      - uses: actions/upload-artifact@v5
        with:
          name: JellyDrax-win-x64
          path: |
            dist/JellyDrax.exe
            dist/JellyDrax-Setup-*.exe

      # Release automatisch: bei einem Versions-Tag oder wenn auf main eine neue
      # Versionsnummer (<Version> in JellyDrax.csproj) ankommt, für die es noch kein Release gibt.
      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag existiert bereits – nichts zu tun."
            exit 0
          fi
          notes=".github/release-notes/$tag.md"
          if [[ -f "$notes" ]]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          gh release create "$tag" \
            "dist/JellyDrax-Setup-$VERSION.exe" \
            dist/JellyDrax.exe \
            --target "$GITHUB_SHA" \
            --title "JellyDrax $VERSION" "${args[@]}"
