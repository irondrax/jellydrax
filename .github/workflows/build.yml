name: build
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/JellyfinDesktop -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: JellyfinDesktop-win-x64
          path: dist/JellyfinDesktop.exe
